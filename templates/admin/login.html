<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GLAPP — Operational Hub Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bs-primary: #4f46e5;
      --bs-primary-rgb: 79, 70, 229;
      --bs-danger: #dc2626;
      --bs-danger-rgb: 220, 38, 38;
      --accent: #4f46e5;
    }
    body {
      background: #f7f8fa;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #0f172a;
    }
    .login-card { max-width: 400px; width: 100%; border-radius: 12px; }
    .brand-logo { width: 48px; height: 48px; border-radius: 10px; background: #0f172a; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; }
    .brand-logo span { color: var(--accent); font-weight: 700; font-size: 1.1rem; }
    .form-control:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,70,229,0.12); }
  </style>
</head>
<body class="vh-100 d-flex align-items-center justify-content-center" style="background:#f7f8fa">
  <div class="login-card card border p-4" style="box-shadow:0 1px 3px rgba(15,23,42,0.04)">
    <div class="card-body text-center">
      <div class="brand-logo"><span>GA</span></div>
      <h4 class="fw-bold mb-1" style="font-size:1.15rem">GLAPP Operational Hub</h4>
      <p class="text-muted small mb-4">Authorized administrators only</p>

      {% if form.errors %}
      <div class="alert alert-danger py-2 small border-0" role="alert" style="background:#fdedee;color:#b91c1c">
        Invalid username or password. Please try again.
      </div>
      {% endif %}

      <form method="post" action="{% url 'admin_login' %}">
        {% csrf_token %}
        <div class="text-start mb-3">
          <label class="form-label small fw-semibold text-muted">Username</label>
          <input type="text" name="username" class="form-control" placeholder="Enter your username" required autofocus>
        </div>
        <div class="text-start mb-4">
          <label class="form-label small fw-semibold text-muted">Password</label>
          <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Sign In</button>
      </form>
    </div>
  </div>
</body>
</html>
